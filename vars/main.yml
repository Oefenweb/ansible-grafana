# vars file
---
grafana_keyring_src: https://apt.grafana.com/gpg.key
grafana_keyring_dst: /usr/share/keyrings/grafana.gpg
grafana_repositories:
  - type: 'deb [signed-by={{ grafana_keyring_dst }} arch=amd64]'
    url: 'https://apt.grafana.com stable'
    component: main
  - type: 'deb [arch=amd64]'
    url: 'https://apt.grafana.com stable'
    component: main
    state: absent

grafana_dependencies_pre:
  - software-properties-common
  - dirmngr
  - apt-transport-https
  - wget

grafana_dependencies:
  - grafana
